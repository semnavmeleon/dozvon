; Скопируйте в config.ini и заполните. config.ini с паролем не коммитьте!

[phone]
; IP-адрес телефона Yealink в локальной сети (посмотрите в меню телефона: Статус / Сеть).
host = 172.26.47.19
; Порт веб-интерфейса телефона. Обычно 80.
port = 80
; Логин веб-интерфейса телефона.
user = admin
; Лучше не писать пароль здесь, а задать переменную окружения AUTODOZVON_PASSWORD.
password =

[server]
; Порт, на котором открывается страница обзвона (http://localhost:<порт>).
; На этом же порту телефон присылает события (Action URL), поэтому порт должен быть доступен по сети.
port = 8000
